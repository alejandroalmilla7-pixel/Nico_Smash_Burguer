
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/nombres_db
    depends_on:
      db:
        condition: service_healthy # <-- Esto frena al contenedor web hasta que Postgres responda

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nombres_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nombres_db"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: